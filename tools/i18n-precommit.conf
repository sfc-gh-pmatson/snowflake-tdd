# Translation commit check — tools/i18n-precommit.py
#
# mode = warn   report findings, always let the commit through (default)
#        block  refuse the commit when a translation was invalidated
#        off    skip the check entirely
#
# Warn is the default on purpose: this reports a correctness risk, not a broken
# build, and a gate that blocks by default gets bypassed reflexively with
# --no-verify. Switch to block once enough of the deck is translated that stale
# Spanish would actually reach an audience.
#
# Precedence: command-line flag > TDD_I18N env var > this file > warn.
# One-off override:  TDD_I18N=block git commit ...
#                    TDD_I18N=off   git commit ...

mode = warn
