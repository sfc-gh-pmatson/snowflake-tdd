name: Deploy to Snowflake SPCS

on:
  push:
    branches: [main]

env:
  SNOWFLAKE_ACCOUNT: SFSENORTHAMERICA-PMAT_AWS1
  SNOWFLAKE_USER: PMATSON
  REGISTRY: sfsenorthamerica-pmat-aws1.registry.snowflakecomputing.com
  IMAGE: sfsenorthamerica-pmat-aws1.registry.snowflakecomputing.com/demo/public/images/interactive-tdd
  SERVICE: DEMO.PUBLIC.INTERACTIVE_TDD

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write private key file
        run: |
          echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > /tmp/rsa_key.p8
          chmod 600 /tmp/rsa_key.p8

      - name: Generate JWT for Docker registry login
        run: |
          pip install snowflake-connector-python
          python3 -c "
          import snowflake.connector
          ctx = snowflake.connector.connect(
              account='${SNOWFLAKE_ACCOUNT}',
              user='${SNOWFLAKE_USER}',
              private_key_file='/tmp/rsa_key.p8',
          )
          token = ctx.rest.token
          ctx.close()
          with open('/tmp/registry_token', 'w') as f:
              f.write(token)
          "

      - name: Login to Snowflake Image Registry
        run: |
          cat /tmp/registry_token | docker login ${{ env.REGISTRY }} \
            -u 0sessiontoken --password-stdin

      - name: Build Docker image
        run: docker build --platform linux/amd64 -t ${{ env.IMAGE }}:latest .

      - name: Push image to registry
        run: docker push ${{ env.IMAGE }}:latest

      - name: Install Snowflake CLI
        uses: Snowflake-Labs/snowflake-cli-action@v2
        with:
          cli-version: "latest"

      - name: Restart service to pick up new image
        env:
          SNOWFLAKE_CONNECTIONS_DEFAULT_ACCOUNT: ${{ env.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_CONNECTIONS_DEFAULT_USER: ${{ env.SNOWFLAKE_USER }}
          SNOWFLAKE_CONNECTIONS_DEFAULT_AUTHENTICATOR: SNOWFLAKE_JWT
          SNOWFLAKE_CONNECTIONS_DEFAULT_PRIVATE_KEY_FILE: /tmp/rsa_key.p8
          SNOWFLAKE_CONNECTIONS_DEFAULT_ROLE: ACCOUNTADMIN
          SNOWFLAKE_CONNECTIONS_DEFAULT_WAREHOUSE: DEMO_WH
        run: |
          snow sql -q "ALTER SERVICE ${{ env.SERVICE }} SUSPEND" || true
          sleep 5
          snow sql -q "ALTER SERVICE ${{ env.SERVICE }} RESUME"
          echo "Service restarted — new image will be pulled on resume."

      - name: Cleanup
        if: always()
        run: rm -f /tmp/rsa_key.p8 /tmp/registry_token
