name: Deploy to Snowflake SPCS

on:
  workflow_dispatch:   # manual trigger only — automated deploys disabled

env:
  SNOWFLAKE_ACCOUNT: SFCOGSOPS-SNOWHOUSE_AWS_US_WEST_2
  SNOWFLAKE_USER: PMATSON
  REGISTRY: sfcogsops-snowhouse-aws-us-west-2.registry.snowflakecomputing.com
  IMAGE: sfcogsops-snowhouse-aws-us-west-2.registry.snowflakecomputing.com/temp/pmatson/images/interactive-tdd
  SERVICE: TEMP.PMATSON.INTERACTIVE_TDD
