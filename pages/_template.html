<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>MODULE_NAME — Snowflake TDD</title>
  <link rel="stylesheet" href="../shared.css">
  <style>
    /* Page-specific styles go here (keep shared styles in shared.css) */
    body { background: transparent; margin: 0; overflow: hidden; }

    /* s6-header uses --fs-h1 / s6-sub uses --fs-h3 by default (shared.css).
       Add text-align:center here if this page needs centered headers. */
  </style>
</head>
<body>
  <script src="../bg.js"></script>

  <!--
    RESOURCE BAR — remove this block if you don't need it on this page.
    Set each key to a URL string to show the button, or null to hide it.
    code: true opens the on-page code modal (content is in #code-modal-content below).
  -->
  <script>
    window.RESOURCE_CONFIG = {
      docs:  null,   // e.g. 'https://docs.snowflake.com/en/...'
      code:  null,   // set to true to enable the code modal
      guide: null,   // e.g. 'https://quickstarts.snowflake.com/guide/...'
      blog:  null,   // e.g. 'https://www.snowflake.com/blog/...'
    };
  </script>
  <script src="../resources.js"></script>
  <div style="position:relative;width:100%;height:100%;z-index:1">
    <div class="nav-bar">
      <a href="../index.html" class="btn-back">&#8592; Back</a>
      <span class="nav-label">MODULE_NAME</span>
      <!--
        NAV TAGS — add any combination; omit the div entirely if not needed.
        Availability: nav-tag-ga (Generally Available), nav-tag-pp (Public Preview), nav-tag-priv (Private Preview)
        Edition:      nav-tag-ent (Enterprise), nav-tag-bc (Business Critical)
      -->
      <div class="nav-tags">
        <span class="nav-tag nav-tag-ga">Generally Available</span>
        <!-- <span class="nav-tag nav-tag-ent">Enterprise</span> -->
      </div>
    </div>
    <div class="slide-canvas with-nav">
      <div id="module" class="sf-slide">

        <!-- Shared header block: eyebrow logo/tag row + title + subtitle -->
        <div class="s6-top">
          <div class="s6-top-row">
            <span class="slide-tag tag-blue">TAG_LABEL</span>
          </div>
          <div class="s6-header" style="margin-top:6px">MODULE_NAME</div>
          <div class="s6-sub">Subtitle or overview sentence.</div>
        </div>

        <!--
          Build your module content below using shared.css components.

          Feature card (icons use the .sf-img registry, not <img>):
            <div class="feat-card">
              <div class="feat-card-head">
                <div class="icon-circle ic-blue" style="width:40px;height:40px">
                  <span class="sf-img sf-icon-analytics" style="width:24px;height:24px;"></span>
                </div>
                <div class="feat-title">Card Title</div>
              </div>
              <div class="feat-body">Description text.</div>
            </div>

          Tag variants: tag-blue, tag-amber, tag-green (tag-purple deprecated — use tag-blue)
          Icon-circle variants: ic-blue, ic-amber (ic-purple, ic-green deprecated — use ic-blue)
        -->

        <div style="flex:1;display:flex;align-items:center;justify-content:center;padding:20px;">
          <!-- Add your feature cards, diagrams, or layout here -->
        </div>

        <!-- Resource bar — populated by resources.js (keep as last child of .sf-slide) -->
        <div class="resource-trigger">
          <div class="resource-bar"></div>
        </div>

      </div>
    </div>
  </div>

  <!--
    CODE MODAL CONTENT — only needed when RESOURCE_CONFIG.code = true.
    Delete this block if not using the Code button.

    Structure:
      .code-modal-code  (left 2/3) — use .code-block + syntax span classes
      .code-modal-explain (right 1/3) — plain text on white background

    Syntax span classes (maps to --code-* tokens in :root):
      .code-kw      — keywords      (SELECT, FROM, WHERE)
      .code-fn      — functions     (SUM, DATEADD, COUNT)
      .code-id      — identifiers   (column names, table names)
      .code-str     — string values
      .code-num     — numbers
      .code-punc    — punctuation   (commas, parens, operators)
      .code-comment — comments      (-- comment text)
  -->
  <div id="code-modal-content" style="display:none">
    <div class="code-modal-code">
      <pre class="code-block"><code><span class="code-kw">SELECT</span>
  <span class="code-id">column_name</span>
<span class="code-kw">FROM</span> <span class="code-id">database.schema.table</span>
<span class="code-kw">WHERE</span> <span class="code-id">condition</span> <span class="code-punc">=</span> <span class="code-str">'value'</span><span class="code-punc">;</span></code></pre>
    </div>
    <div class="code-modal-explain">
      <h4>What this does</h4>
      <p>Explain the query here. This panel has a white background and uses --sf-ink for text color.</p>
    </div>
  </div>

</body>
</html>
