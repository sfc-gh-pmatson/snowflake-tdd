spec:
  containers:
  - name: interactive-tdd
    image: sfcogsops-snowhouse-aws-us-west-2.registry.snowflakecomputing.com/temp/pmatson/images/interactive-tdd:latest
    readinessProbe:
      port: 80
      path: /
    resources:
      limits:
        memory: 13Gi
        cpu: "3"
      requests:
        memory: 0.5Gi
        cpu: "0.5"
  endpoints:
  - name: ui
    port: 80
    public: true
