log_format analytics '$remote_addr - $http_sf_context_current_user [$time_local] '
                     '"$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent" "$http_x_forwarded_for"';

server {
    listen       80;
    server_name  localhost;
    root         /usr/share/nginx/html;
    access_log   /var/log/nginx/access.log analytics;

    # Declare UTF-8 explicitly. Without this, a classic <script src> inherits the
    # including document's encoding, so the accented Spanish in the language files
    # only renders correctly because every page happens to carry a charset meta.
    # Stating it here removes that dependency.
    charset       utf-8;
    charset_types text/plain text/css application/javascript application/json
                  image/svg+xml;

    # Compress the text assets. The pages and the language files are the bulk
    # of the transfer and they compress by roughly 4-5x.
    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_proxied      any;
    # text/html is always gzipped by nginx and must not be listed here.
    gzip_types        text/plain text/css
                      application/javascript application/json
                      image/svg+xml;

    location / {
        index  index.html index.htm;
    }

    # Force revalidation of the code and markup.
    #
    # Without this nginx sends only Last-Modified and ETag, no Cache-Control, so
    # browsers fall back to heuristic freshness and can serve a stale bg.js for
    # hours after a deploy — which is exactly what happened: a redeployed deck
    # still showed the old notes bar and no language picker. "no-cache" does not
    # mean "do not cache"; it means revalidate before use, and with the ETag
    # above that is a cheap 304.
    #
    # Regex locations are matched before prefix locations, but a directory
    # request such as /languages/ has no extension, so the autoindex blocks
    # below are unaffected.
    location ~* \.(html|js|css)$ {
        add_header Cache-Control "no-cache";
    }

    # Directory listing for the notes folder so the app can discover
    # which talk-track note sets exist without a hardcoded manifest.
    # Drop a notes/<id>.js file in and it shows up in the notes picker.
    location /notes/ {
        autoindex      on;
        autoindex_format html;
    }

    # Same drop-in discovery for translations: add a languages/<code>.js
    # file and it shows up in the nav-bar language picker.
    location /languages/ {
        autoindex      on;
        autoindex_format html;
    }
}
